<script>
var SK="pharma_v11";
function load(){try{return JSON.parse(localStorage.getItem(SK)||"{}")}catch(e){return{}}}
function save(s){localStorage.setItem(SK,JSON.stringify(s))}
function safe(k){var h=0;for(var i=0;i<k.length;i++){h=Math.imul(31,h)+k.charCodeAt(i)|0;}return"k"+Math.abs(h)+"_"+k.replace(/[^a-zA-Z0-9]/g,"_").slice(0,20)}
function ck(key){
  var s=load();s[key]=!s[key];save(s);
  var row=document.getElementById("row_"+key);
  var cb=document.getElementById("cb_"+key);
  if(row){if(s[key])row.classList.add("done");else row.classList.remove("done");}
  if(cb)cb.checked=!!s[key];
  updateAll();
}
function tog(el){
  var b=el.nextElementSibling,c=el.querySelector(".chev");
  var o=b.classList.toggle("open");
  if(o)c.classList.add("open");else c.classList.remove("open");
}
function updateAll(){
  var s=load();
  var all=document.querySelectorAll(".item");
  var tot=all.length,done=0;
  all.forEach(function(el){if(s[el.id.replace("row_","")])done++;});
  var pct=tot?Math.round(done/tot*100):0;
  document.getElementById("ov-fill").style.width=pct+"%";
  document.getElementById("ov-label").textContent=done+" / "+tot+" ("+pct+"%)";
  document.querySelectorAll(".wcard").forEach(function(card){
    var its=card.querySelectorAll(".item");
    if(!its.length)return;
    var t=its.length,d=0;
    its.forEach(function(el){if(s[el.id.replace("row_","")])d++;});
    var p=Math.round(d/t*100);
    var pf=card.querySelector(".pf");
    var pl=card.querySelector(".pl");
    if(pf)pf.style.width=p+"%";
    if(pl)pl.textContent=d+"/"+t+" 完成";
  });
}
function buildSlots(id,slots,s){
  var html="";
  slots.forEach(function(slot){
    var items="";
    slot.tasks.forEach(function(t,ti){
      var key=safe(id+"__"+slot.label+"__"+ti);
      var checked=!!s[key];
      var cc=t.t==="new"?" c-new":t.t==="ra"?" c-ra":t.t==="rb"?" c-rb":t.t==="rc"?" c-rc":t.t==="purple"?" c-purple":"";
      var div=document.createElement("div");
      div.className="item"+(checked?" done":"");
      div.id="row_"+key;
      div.setAttribute("onclick","ck('"+key+"')");
      var cb=document.createElement("input");
      cb.type="checkbox";cb.id="cb_"+key;cb.checked=checked;
      cb.setAttribute("onclick","event.stopPropagation()");
      var span=document.createElement("span");
      span.className="tx"+cc;span.textContent=t.x;
      div.appendChild(cb);div.appendChild(span);
      items+=div.outerHTML;
    });
    html+='<div class="sr"><span class="slb" style="'+slot.ls+'">'+slot.label+'</span><div>'+items+'</div></div>';
  });
  return html;
}
function buildCard(item,slots,s,isToday){
  var tot=0,done=0;
  slots.forEach(function(slot){
    slot.tasks.forEach(function(t,ti){
      var key=safe(item.id+"__"+slot.label+"__"+ti);
      tot++;if(s[key])done++;
    });
  });
  var pct=tot?Math.round(done/tot*100):0;
  return '<div class="wcard'+(isToday?" today":"")+'">'
    +'<div class="wtop" onclick="tog(this)">'
    +'<span class="wbg" style="'+item.bs+'">'+item.badge+'</span>'
    +'<span class="wdt">'+item.dates+'</span>'
    +'<span class="wti">'+item.title+'</span>'
    +'<span style="font-size:11px;color:#aaa;margin-right:4px">'+pct+'%</span>'
    +'<span class="chev'+(isToday?" open":"")+'">▶</span>'
    +'</div>'
    +'<div class="wbody'+(isToday?" open":"")+'">'
    +buildSlots(item.id,slots,s)
    +'<div style="padding:.4rem 1rem .5rem">'
    +'<div class="pb"><div class="pf" style="width:'+pct+'%"></div></div>'
    +'<div class="pl">'+done+"/"+tot+" 完成</div>"
    +'</div></div></div>';
}

    items.forEach(function(item){
      var slots=p.type==="daily"?item.slots:item.subjects;
      var dates=item.dates||item.date||"";
      var title=item.title||item.date||"";
      html+=buildCard({id:item.id,badge:item.badge,bs:item.bs,dates:dates,title:title},slots,s,!!item.today);

  });
