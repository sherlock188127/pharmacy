function render(){
  let total=0;
  Object.keys(DATA).forEach(gid=>{
    const blkClass = gid.replace('g','b');
    const secNum = gid.replace('g','');
    const host=document.getElementById(gid);
    DATA[gid].forEach((q,qi)=>{
      total++;
      const qid=gid+'_'+qi;
      const card=document.createElement('div');
      card.className='q '+blkClass;
      let opts='';
      q.o.forEach((t,oi)=>{
        opts+=`<button class="opt" data-q="${qid}" data-i="${oi}">(${'ABCD'[oi]}) ${t}</button>`;
      });
      card.innerHTML=`
        <div class="qmeta">${q.m}</div>
        <div class="qstem">${q.s}</div>
        ${opts}
        <div class="ctrl"><button class="btn exbtn" data-q="${qid}">顯示詳解</button></div>
        <div class="exp" id="exp_${qid}"><b>✔ 正解 (${'ABCD'[q.a]})</b>　${q.e}</div>
        <div class="note"><label>📝 補充筆記</label><textarea data-note="${qid}"></textarea></div>
      `;
      host.appendChild(card);
    });
  });
  document.getElementById('cnt').textContent=total;

  // 選項點擊
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const qid=btn.dataset.q, i=+btn.dataset.i;
      const [gid,qi]=qid.split('_');
      const ans=DATA[gid][+qi].a;
      btn.classList.remove('right','wrong');
      btn.classList.add(i===ans?'right':'wrong');
    });
  });
  // 詳解
  document.querySelectorAll('.exbtn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const exp=document.getElementById('exp_'+btn.dataset.q);
      exp.classList.toggle('show');
      btn.textContent=exp.classList.contains('show')?'隱藏詳解':'顯示詳解';
    });
  });
  // 筆記 localStorage
  document.querySelectorAll('textarea[data-note]').forEach(ta=>{
    const key='dispnote_'+ta.dataset.note;
    ta.value=localStorage.getItem(key)||'';
    ta.addEventListener('input',()=>localStorage.setItem(key,ta.value));
  });
}
render();
</script>
