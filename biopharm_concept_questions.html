function getFiltered() {
  return Q.filter(function(q) {
    return (ay === "all" || q.y === ay) && (at === "all" || q.k === at);
  });
}

function buildFilters() {
  var years = ["all"];
  Q.forEach(function(q){ if(years.indexOf(q.y)<0) years.push(q.y); });
  var topics = ["all"].concat(Object.keys(TM));

  var yb = document.getElementById("yearBar");
  yb.innerHTML = "";
  years.forEach(function(y) {
    var b = document.createElement("button");
    b.className = "fbtn" + (ay===y?" on":"");
    b.textContent = y==="all"?"全部年份":y;
    b.addEventListener("click", function(){ ay=y; render(); });
    yb.appendChild(b);
  });

  var tb = document.getElementById("topicBar");
  tb.innerHTML = "";
  topics.forEach(function(t) {
    var b = document.createElement("button");
    b.className = "fbtn" + (at===t?" on":"");
    b.textContent = t==="all"?"全部主題":TM[t].l;
    b.addEventListener("click", function(){ at=t; render(); });
    tb.appendChild(b);
  });
}

function buildStats(list) {
  document.getElementById("stats").innerHTML =
    '<div class="stat"><div class="stat-label">總題數</div><div class="stat-num">'+Q.length+'</div></div>' +
    '<div class="stat"><div class="stat-label">目前顯示</div><div class="stat-num">'+list.length+'</div></div>';
}

function buildList(list) {
  var el = document.getElementById("qlist");
  if(!list.length){ el.innerHTML='<div class="empty">此篩選條件無題目</div>'; return; }
  el.innerHTML = "";
  list.forEach(function(q, i) {
    var tm = TM[q.k];
    var card = document.createElement("div");
    card.className = "qcard";

    var opts = q.o.map(function(o, idx){
      return '<div class="opt'+(idx===q.a?" ok":"")+'">'+ o +'</div>';
    }).join("");

    card.innerHTML =
      '<div class="qhead">'+
        '<div class="qstem">'+q.y+' 第'+q.n+'題 — '+q.s+'</div>'+
        '<div class="qmeta">'+
          '<span class="badge-year">'+q.y+'</span>'+
          '<span class="tag '+tm.c+'">'+tm.l+'</span>'+
        '</div>'+
        '<span class="arrow">▾</span>'+
      '</div>'+
      '<div class="qbody">'+
        '<div class="ans-label">選項（綠色為正確答案）</div>'+
        '<div class="opts">'+opts+'</div>'+
      '</div>';

    card.addEventListener("click", function(){
      this.classList.toggle("open");
    });
    el.appendChild(card);
  });
}

function render() {
  var list = getFiltered();
  buildFilters();
  buildStats(list);
  buildList(list);
}

render();
</script>
</body>
</html>
