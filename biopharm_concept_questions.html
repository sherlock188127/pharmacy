const topicMeta = {
  pk: { label: "藥動學概念", cls: "t-pk" },
  abs: { label: "吸收動力學", cls: "t-abs" },
  ba: { label: "生體可用率", cls: "t-ba" },
  be: { label: "BCS/IVIVC/BE", cls: "t-be" },
  nr: { label: "腎/肝功能", cls: "t-nr" },
  tr: { label: "基因/轉運蛋白", cls: "t-tr" },
  cr: { label: "控釋劑型", cls: "t-cr" }
};

let activeYear = "all";
let activeTopic = "all";

function renderStats() {
  const visible = filtered();
  const byTopic = {};
  visible.forEach(q => { byTopic[q.key] = (byTopic[q.key]||0)+1; });
  const statsRow = document.getElementById("statsRow");
  statsRow.innerHTML = `
    <div class="stat-card"><div class="stat-label">總題數</div><div class="stat-num">${questions.length}</div></div>
    <div class="stat-card"><div class="stat-label">目前顯示</div><div class="stat-num">${visible.length}</div></div>
  `;
}

function renderFilters() {
  const years = ["all", ...new Set(questions.map(q=>q.year))];
  const topics = ["all", ...Object.keys(topicMeta)];

  const fb = document.getElementById("filterBar");
  fb.innerHTML = "";

  const yearDiv = document.createElement("div");
  yearDiv.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;align-items:center;";
  years.forEach(y => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (activeYear===y?" active":"");
    btn.textContent = y==="all" ? "全部年份" : y.replace("-","年 第"+"次");
    btn.onclick = () => { activeYear=y; render(); };
    yearDiv.appendChild(btn);
  });
  fb.appendChild(yearDiv);

  const topicDiv = document.createElement("div");
  topicDiv.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;";
  topics.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (activeTopic===t?" active":"");
    btn.textContent = t==="all" ? "全部主題" : topicMeta[t].label;
    btn.onclick = () => { activeTopic=t; render(); };
    topicDiv.appendChild(btn);
  });
  fb.appendChild(topicDiv);
}

function filtered() {
  return questions.filter(q => {
    const yOk = activeYear==="all" || q.year===activeYear;
    const tOk = activeTopic==="all" || q.key===activeTopic;
    return yOk && tOk;
  });
}

function renderList() {
  const ql = document.getElementById("qList");
  const qs = filtered();
  if (!qs.length) {
    ql.innerHTML = '<div class="no-results">此篩選條件無題目</div>';
    return;
  }
  ql.innerHTML = "";
  qs.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "q-card";
    const tm = topicMeta[q.key];
    const correctIdx = q.ans.charCodeAt(0)-65;
    const optsHtml = q.opts.map((o,idx)=>
      `<div class="ans-item${idx===correctIdx?" correct":""}">${o}</div>`
    ).join("");
    card.innerHTML = `
      <div class="q-header">
        <div class="q-stem">${q.year} 第${q.qn}題 — ${q.stem}</div>
        <div class="q-meta">
          <span class="badge badge-year">${q.year}</span>
          <span class="topic-tag ${tm.cls}">${tm.label}</span>
        </div>
        <span class="expand-icon">▾</span>
      </div>
      <div class="q-ans-block">
        <div class="ans-label">選項（綠色為正確答案）</div>
        <div class="ans-row">${optsHtml}</div>
      </div>
    `;
    card.onclick = () => card.classList.toggle("expanded");
    ql.appendChild(card);
  });
}

function render() {
  renderFilters();
  renderStats();
  renderList();
}

render();
</script>
