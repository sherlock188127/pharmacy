function getKey(id,lb,ti){return `${id}__${lb}__${ti}`}
function load(){try{return JSON.parse(localStorage.getItem('pharma4')||'{}')}catch(e){return{}}}
function save(s){localStorage.setItem('pharma4',JSON.stringify(s))}
function onCheck(key,el){const s=load();s[key]=el.checked;save(s);el.closest('.task-item').classList.toggle('done',el.checked);updateOverall();}
function tog(el){const b=el.nextElementSibling,c=el.querySelector('.chev');b.classList.toggle('open');c.classList.toggle('open',b.classList.contains('open'));}
function renderTasks(id,lb,tasks,state){
  return tasks.map((task,ti)=>{
    const key=getKey(id,lb,ti);const checked=!!state[key];
    const cls=task.t==='new'?' new-text':task.t==='ra'?' ra':task.t==='rb'?' rb':task.t==='rc'?' rc':'';
    return `<label class="task-item${checked?' done':''}"><input type="checkbox" ${checked?'checked':''} onchange="onCheck('${key}',this)"><span class="task-text${cls}">${task.x}</span></label>`;
  }).join('');
}
function renderCard(id,isToday,badge,bs,dates,title,slots,state){
  const total=slots.reduce((a,s)=>a+s.tasks.length,0);
  const done=slots.reduce((a,s)=>a+s.tasks.filter((_,ti)=>state[getKey(id,s.label,ti)]).length,0);
  const pct=total?Math.round(done/total*100):0;
  const srows=slots.map(s=>`<div class="sr"><span class="slb" style="${s.ls}">${s.label}</span><div class="task-list">${renderTasks(id,s.label,s.tasks,state)}</div></div>`).join('');
  return `<div class="wcard${isToday?' today':''}">
    <div class="wtop" onclick="tog(this)">
      <span class="wbg" style="${bs}">${badge}</span>
      <span class="wdt">${dates}</span>
      <span class="wti">${title}</span>
      <span style="font-size:11px;color:#aaa;margin-right:4px">${pct}%</span>
      <span class="chev">▶</span>
    </div>
    <div class="wbody${isToday?' open':''}">
      ${srows}
      <div style="padding:.4rem 1rem .5rem"><div class="pb"><div class="pf" style="width:${pct}%"></div></div><div class="pl">${done}/${total} 完成</div></div>
    </div>
  </div>`;
}
function updateOverall(){
  const state=load();let total=0,done=0;
  DATA.forEach(p=>{
    const items=p.type==='daily'?p.days:p.weeks;
    items.forEach(item=>{
      const slots=p.type==='daily'?item.slots:item.subjects;
      slots.forEach(s=>s.tasks.forEach((_,ti)=>{total++;if(state[getKey(item.id,s.label,ti)])done++;}));
    });
  });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('ov-fill').style.width=pct+'%';
  document.getElementById('ov-label').textContent=`${done} / ${total} (${pct}%)`;
}
function render(){
  const state=load();let html='';
  DATA.forEach(p=>{
    html+=`<div class="phase-hd">${p.phase}</div>`;
    if(p.phase.includes('刷題'))html+=`<div class="banner binfo">一天寫完一回，分 3 天訂正。錯題當天記入錯誤本。</div>`;
    const items=p.type==='daily'?p.days:p.weeks;
    items.forEach(item=>{
      const slots=p.type==='daily'?item.slots:item.subjects;
      const dates=p.type==='daily'?item.date:item.dates;
      const title=p.type==='daily'?item.date:item.title;
      html+=renderCard(item.id,!!item.today,item.badge,item.bs,dates,title,slots,state);
    });
  });
  document.getElementById('app').innerHTML=html;
  updateOverall();
}
render();
