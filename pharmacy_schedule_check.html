<script>
var SK = 'pharma_v6';
function load(){try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}}}
function save(s){localStorage.setItem(SK,JSON.stringify(s))}

function ck(key){
  var s=load(); s[key]=!s[key]; save(s);
  var row=document.getElementById('row_'+key);
  var cb=document.getElementById('cb_'+key);
  if(!row||!cb) return;
  cb.checked=s[key];
  if(s[key]) row.classList.add('done'); else row.classList.remove('done');
  recalcOverall();
}

function tog(el){
  var b=el.nextElementSibling;
  var c=el.querySelector('.chev');
  var open=b.classList.toggle('open');
  if(open) c.classList.add('open'); else c.classList.remove('open');
}

function recalcOverall(){
  var s=load();
  var all=document.querySelectorAll('.item');
  var total=all.length, done=0;
  all.forEach(function(el){ if(s[el.id.replace('row_','')]) done++; });
  var pct=total?Math.round(done/total*100):0;
  document.getElementById('ov-fill').style.width=pct+'%';
  document.getElementById('ov-label').textContent=done+' / '+total+' ('+pct+'%)';
  document.querySelectorAll('.wcard').forEach(function(card){
    var its=card.querySelectorAll('.item');
    if(!its.length)return;
    var t=its.length,d=0;
    its.forEach(function(el){if(s[el.id.replace('row_','')])d++;});
    var p=Math.round(d/t*100);
    var pf=card.querySelector('.pf');
    var pl=card.querySelector('.pl');
    if(pf)pf.style.width=p+'%';
    if(pl)pl.textContent=d+'/'+t+' 完成';
  });
}

// 安全的key（只留英數底線）
function safeKey(k){ return k.replace(/[^a-zA-Z0-9]/g,'_'); }

function buildSlots(id, slots, s){
  var html='';
  slots.forEach(function(slot){
    var items='';
    slot.tasks.forEach(function(t,ti){
      var key=safeKey(id+'__'+slot.label+'__'+ti);
      var checked=!!s[key];
      var colorCls = t.t==='new'?' c-new':t.t==='ra'?' c-ra':t.t==='rb'?' c-rb':t.t==='rc'?' c-rc':'';
      items+='<div class="item'+(checked?' done':'')+'" id="row_'+key+'" onclick="ck(\''+key+'\')">'
        +'<input type="checkbox" id="cb_'+key+'" '+(checked?'checked ':'')+'onclick="event.stopPropagation()">'
        +'<span class="tx'+colorCls+'">'+t.x+'</span>'
        +'</div>';
    });
    html+='<div class="sr">'
      +'<span class="slb" style="'+slot.ls+'">'+slot.label+'</span>'
      +'<div>'+items+'</div>'
      +'</div>';
  });
  return html;
}

function buildCard(item, slots, s, isToday){
  var total=0,done=0;
  slots.forEach(function(slot){
    slot.tasks.forEach(function(t,ti){
      var key=safeKey(item.id+'__'+slot.label+'__'+ti);
      total++;
      if(s[key]) done++;
    });
  });
  var pct=total?Math.round(done/total*100):0;
  var dates=item.dates||item.date||'';
  var title=item.title||item.date||'';
  return '<div class="wcard'+(isToday?' today':'')+'">'
    +'<div class="wtop" onclick="tog(this)">'
    +'<span class="wbg" style="'+item.bs+'">'+item.badge+'</span>'
    +'<span class="wdt">'+dates+'</span>'
    +'<span class="wti">'+title+'</span>'
    +'<span style="font-size:11px;color:#aaa;margin-right:4px">'+pct+'%</span>'
    +'<span class="chev'+(isToday?' open':'')+'">▶</span>'
    +'</div>'
    +'<div class="wbody'+(isToday?' open':'')+'">'
    +buildSlots(item.id, slots, s)
    +'<div style="padding:.4rem 1rem .5rem">'
    +'<div class="pb"><div class="pf" style="width:'+pct+'%"></div></div>'
    +'<div class="pl">'+done+'/'+total+' 完成</div>'
    +'</div>'
    +'</div>'
    +'</div>';
}

function render(){
  var s=load();
  var html='';
  D.forEach(function(p){
    html+='<div class="phase-hd">'+p.ph+'</div>';
    if(p.ph.indexOf('刷題')>=0) html+='<div class="banner binfo">一天寫完一回，分 3 天訂正。錯題當天記入錯誤本。</div>';
    var items=p.type==='daily'?p.days:p.weeks;
    items.forEach(function(item){
      var slots=p.type==='daily'?item.slots:item.subjects;
      html+=buildCard(item,slots,s,!!item.today);
    });
  });
  document.getElementById('app').innerHTML=html;
  recalcOverall();
}
render();
</script>
