function getKey(wid, si, ti){ return `${wid}_${si}_${ti}`; }

function loadState(){ try{ return JSON.parse(localStorage.getItem('pharma_check')||'{}'); }catch(e){ return {}; } }
function saveState(state){ localStorage.setItem('pharma_check', JSON.stringify(state)); }

function countAll(){
  let total=0, done=0;
  DATA.forEach(p=>p.weeks.forEach(w=>w.subjects.forEach(s=>s.tasks.forEach(()=>total++))));
  const state=loadState();
  Object.values(state).forEach(v=>{ if(v) done++; });
  return {total, done};
}

function updateOverall(){
  const {total,done}=countAll();
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('overall-fill').style.width=pct+'%';
  document.getElementById('overall-label').textContent=done+'/'+total+' ('+pct+'%)';
}

function render(){
  const state=loadState();
  const app=document.getElementById('app');
  let html='';

  DATA.forEach(phase=>{
    html+=`<div class="phase-hd">${phase.phase}</div>`;

    if(phase.phase.includes('刷題')){
      html+=`<div class="banner binfo">一天寫完一回，分 3 天訂正。錯題當天記入錯誤本。</div>`;
    }

    phase.weeks.forEach(week=>{
      const totalW=week.subjects.reduce((a,s)=>a+s.tasks.length,0);
      const doneW=week.subjects.reduce((a,s)=>a+s.tasks.filter((_,ti)=>{
        return state[getKey(week.id,s.label,ti)];
      }).length,0);
      const pctW=totalW?Math.round(doneW/totalW*100):0;

      html+=`<div class="wcard">
        <div class="wtop" onclick="tog(this)">
          <span class="wbg" style="${week.badgeStyle}">${week.badge}</span>
          <span class="wdt">${week.dates}</span>
          <span class="wti">${week.title}</span>
          <span style="font-size:11px;color:#aaa;margin-right:4px">${pctW}%</span>
          <span class="chev">▶</span>
        </div>
        <div class="wbody">`;

      week.subjects.forEach((subj,si)=>{
        html+=`<div class="sr">
          <span class="slb" style="${subj.ls}">${subj.label}</span>
          <div class="task-list">`;
        subj.tasks.forEach((task,ti)=>{
          const key=getKey(week.id,subj.label,ti);
          const checked=state[key]?'checked':'';
          const doneClass=state[key]?' done':'';
          let textClass='';
          if(task.type==='new') textClass=' new-text';
          else if(task.type==='ra') textClass=' style="color:#854F0B"';
          else if(task.type==='rb') textClass=' style="color:#993C1D"';
          else if(task.type==='rc') textClass=' style="color:#3B6D11"';

          const spanStyle = task.type==='ra' ? ' style="color:#854F0B"'
            : task.type==='rb' ? ' style="color:#993C1D"'
            : task.type==='rc' ? ' style="color:#3B6D11"' : '';
          const spanClass = task.type==='new' ? ' class="task-text new-text"' : ' class="task-text"';

          html+=`<label class="task-item${doneClass}" data-key="${key}">
            <input type="checkbox" ${checked} onchange="toggle('${key}',this)">
            <span${spanClass}${spanStyle}>${task.text}</span>
          </label>`;
        });
        html+=`</div></div>`;
      });

      html+=`<div style="padding:.4rem 1rem .5rem">
        <div class="progress-bar"><div class="progress-fill" style="width:${pctW}%"></div></div>
        <div class="progress-label">${doneW}/${totalW} 完成</div>
      </div>`;

      html+=`</div></div>`;

      if(week.id==='w8'){
        html+=`<div class="bblank">🔲 6/18–6/21 空白（期末考備考）— 不排任何國考內容</div>`;
        html+=`<div class="banner bdanger">📚 6/22–6/28 期末考週</div>`;
      }
    });
  });

  app.innerHTML=html;
}

function toggle(key, el){
  const state=loadState();
  state[key]=el.checked;
  saveState(state);
  const label=el.closest('.task-item');
  if(el.checked) label.classList.add('done');
  else label.classList.remove('done');
  updateOverall();
  // update week progress
  render_week_progress();
}

function render_week_progress(){
  // re-render just progress bars without full re-render
  updateOverall();
}

function tog(el){
  const b=el.nextElementSibling;
  const c=el.querySelector('.chev');
  b.classList.toggle('open');
  c.classList.toggle('open',b.classList.contains('open'));
}

render();
updateOverall();
</script>
</body>
</html>
